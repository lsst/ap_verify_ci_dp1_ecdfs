  name: refcats/DM-49042/the_monster_20250219
  doc: "Reference Catalog: the_monster_20250219 (version 2)\n##########################\n\
    \nSky coverage: full sky\nNumber of sources: 1,811,709,771 (1.8 x 10^9)\nMagnitude\
    \ range: 6.9 - 23.3 (LSST g magnitude)\nDisk space: 880 GB\nContact: Peter Ferguson,\
    \ petersferguson@gmail.com, Slack: @Peter Ferguson\nTicket: DM-49042\nRFC: RFC-1047\n\
    \nThe creation of the_monster refcat is described in detail in https://dmtn-277.lsst.io/.\
    \ \nBriefly summarizing, this refcat is intended to be used during comissioning\
    \ for the calibration of LSSTCam\nand LATISS data.\nThe rows of the catalog are\
    \ all isolated sources from GaiaDR3. \nThe columns include all astrometry positions,\
    \ proper motions and covariances from GaiaDR3.\nAdditionally, there are fluxes\
    \ provided in ComCam (ugrizy), LASTISS (grizy), SDSS (u), and DES (grizy) bandpasses.\
    \  \nThese fluxes are derived from a number of other reference catalogs as decribed\
    \ in dmtn-277\n\nThis version differs from the 20240904 version in a few key ways:\n\
    - The header metadata has been changed to be in line with science pipeline expectations\n\
    - Color transformations to the LSSTComCam ITL system (empirical) have been added\n\
    - A better absolute calibration has been achieved\n\n\nCitations/acknowledgements\n\
    ==========================\n\nDMTN-277\n\nCatalog creation\n================\n\
    This catalog was created by using : https://github.com/lsst-dm/the_monster \n\
    following:\nhttps://pipelines.lsst.io/modules/lsst.meas.algorithms/creating-a-reference-catalog.html\n\
    Ingestion was done on DM-49042\n\nUpdate with new commands:\n#butler register-dataset-type\
    \ REPO the_monster_20240904 SimpleCatalog htm7\n#butler ingest-files -t direct\
    \ /repo/main the_monster_20240904 refcats/DM-46370/the_monster_20240904 ./the_monster_20240904/the_monster_20240904.ecsv\n\
    \n\n"
